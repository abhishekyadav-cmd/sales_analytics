version: 2

sources:
  - name: tpch
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    tables:
      - name: customer
      - name: orders
      - name: lineitem
      - name: part
      - name: supplier
      - name: nation
      - name: region

  - name: raw
    database: ANALYTICS
    schema: RAW
    tables:
      - name: region_targets
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

